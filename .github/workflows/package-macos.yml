name: Paquete macOS (Apple Silicon)

# Genera un paquete autocontenido de benzIA para macOS en chips Apple Silicon
# (M1 a M5): codigo + node_modules de produccion + el runtime oficial de Node 24
# para arm64 + lanzador benzia.command. No compila nada: empaqueta el proyecto
# tal cual, sin cambios en el codigo.
#
# Uso: pestana Actions -> "Paquete macOS (Apple Silicon)" -> Ejecutar workflow.
# Al terminar, descarga el artefacto "benzia-darwin-arm64". Si ademas creas una
# etiqueta (p. ej. v1.1.0), el paquete se adjunta a esa release de GitHub.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  paquete-macos:
    # macos-14 corre en hardware Apple Silicon: el node_modules (y el binario
    # nativo de @openai/codex) que se instala aqui es arm64 de forma nativa.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar solo dependencias de produccion
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Comprobar que el proyecto arranca con el codigo empaquetado
        run: |
          DATA_DIR="$RUNNER_TEMP/smoke-data" GATEWAY_PORT=3599 ADMIN_PORT=3598 \
            node --disable-warning=ExperimentalWarning src/server.js &
          SERVER_PID=$!
          sleep 4
          curl --fail --silent http://127.0.0.1:3599/health || exit 1
          kill $SERVER_PID

      - name: Descargar el runtime oficial de Node para Apple Silicon
        run: |
          NODE_VERSION=$(node -p "process.versions.node")
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-arm64.tar.gz"
          mkdir -p runtime
          tar -xzf "node-v${NODE_VERSION}-darwin-arm64.tar.gz" -C runtime --strip-components=1
          test "$(runtime/bin/node -p 'process.arch')" = "arm64"

      - name: Montar el paquete
        run: |
          STAGE="$RUNNER_TEMP/benzia-darwin-arm64"
          mkdir -p "$STAGE/app" "$STAGE/runtime"
          # Codigo del proyecto tal cual (sin .git ni ficheros de desarrollo).
          rsync -aR --files-from=<(git ls-files) . "$STAGE/app/"
          cp -R node_modules "$STAGE/app/node_modules"
          cp .env.example "$STAGE/app/.env.example"
          cp -R runtime "$STAGE/runtime"
          cp scripts/macos-launcher.command "$STAGE/benzia.command"
          cp scripts/macos-README.md "$STAGE/LEEME.txt"
          chmod +x "$STAGE/benzia.command" "$STAGE/runtime/bin/node"
          # Prueba real del paquete montado, desde su propia estructura.
          (cd "$STAGE" && GATEWAY_PORT=3411 ADMIN_PORT=3410 DATA_DIR="$STAGE/smoke-data" ./benzia.command --smoke &)
          sleep 5
          curl --fail --silent http://127.0.0.1:3411/health || exit 1
          pkill -f "runtime/bin/node" || true
          rm -rf "$STAGE/smoke-data"
          ditto -c -k --keepParent "$STAGE" benzia-darwin-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: benzia-darwin-arm64
          path: benzia-darwin-arm64.zip

      - name: Adjuntar a la release si hay etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: benzia-darwin-arm64.zip
